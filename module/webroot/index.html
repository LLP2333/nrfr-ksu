<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nrfr KSU</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1d21; --muted: #6b7280;
    --line: #e3e5e9; --accent: #2563eb; --accent-fg: #fff; --danger: #dc2626; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --card: #1b1e23; --fg: #e8eaed; --muted: #9aa0a8;
      --line: #2c3036; --accent: #3b82f6; --danger: #f87171; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--fg); font-size: 15px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--fg); font-size: 15px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--muted);
        margin: 0; max-height: 220px; overflow: auto; }
  .note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <h1>Nrfr KSU</h1>
  <div class="sub">修改 SIM 卡国家码 / 运营商名称。仅内存覆盖：禁用模块或重启后自动还原。</div>
  <div id="sims"><div class="card note">读取中…</div></div>
  <div class="card">
    <div class="row"><span class="title">日志</span><button id="refresh" style="flex:0 0 auto;padding:4px 12px">刷新</button></div>
    <pre id="log"></pre>
  </div>
  <datalist id="isos">
    <option value="jp">日本</option><option value="us">美国</option><option value="gb">英国</option>
    <option value="kr">韩国</option><option value="hk">中国香港</option><option value="tw">中国台湾</option>
    <option value="sg">新加坡</option><option value="de">德国</option><option value="fr">法国</option>
    <option value="ca">加拿大</option><option value="au">澳大利亚</option><option value="cn">中国</option>
  </datalist>
<script>
const MOD = '/data/adb/modules/nrfr_ksu';
const CONF = '/data/adb/nrfr/nrfr.conf';
const BIN = `MODDIR=${MOD} . ${MOD}/common.sh;`;

let seq = 0;
function exec(cmd) {
  return new Promise((resolve) => {
    if (typeof ksu === 'undefined') { resolve({ code: 1, out: '', err: '请在 KernelSU 管理器中打开' }); return; }
    const cb = `__nrfr_cb_${Date.now()}_${seq++}`;
    window[cb] = (code, out, err) => { delete window[cb]; resolve({ code, out, err }); };
    ksu.exec(cmd, '{}', cb);
  });
}
const q = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) { if (typeof ksu !== 'undefined' && ksu.toast) ksu.toast(msg); }

async function readConf() {
  const r = await exec(`cat ${CONF} 2>/dev/null`);
  const conf = {};
  for (const line of (r.out || '').split('\n')) {
    const m = line.trim().match(/^([1-4])\s*=\s*([^,]*)(?:,(.*))?$/);
    if (m) conf[m[1]] = { iso: m[2].trim(), name: (m[3] || '').trim() };
  }
  return conf;
}

async function writeConf(conf) {
  let body = '# Nrfr KSU 配置。每行: <卡槽>=<两位国家码>[,<运营商名称>]\n';
  for (const slot of Object.keys(conf).sort()) {
    const { iso, name } = conf[slot];
    body += `${slot}=${iso}${name ? ',' + name : ''}\n`;
  }
  return exec(`mkdir -p /data/adb/nrfr && printf %s ${q(body)} > ${CONF}`);
}

async function render() {
  const [list, conf] = await Promise.all([exec(`${BIN} nrfr list`), readConf()]);
  const box = document.getElementById('sims');
  if (list.code !== 0) { box.innerHTML = `<div class="card note">${esc(list.err || list.out)}</div>`; return; }
  const sims = list.out.trim().split('\n').filter((l) => l.startsWith('slot=')).map((l) =>
    Object.fromEntries(l.split('\t').map((kv) => { const i = kv.indexOf('='); return [kv.slice(0, i), kv.slice(i + 1)]; })));
  if (!sims.length) { box.innerHTML = '<div class="card note">未检测到 SIM 卡</div>'; return; }
  box.innerHTML = sims.map((s) => {
    const c = conf[s.slot] || { iso: '', name: '' };
    const on = s.override_iso !== '';
    return `<div class="card" data-slot="${s.slot}">
      <div class="row"><span class="title">卡槽 ${s.slot} · ${esc(s.carrier)}</span>
        <span class="badge ${on ? 'on' : ''}">${on ? '已覆盖' : '原始'}</span></div>
      <div class="meta">当前国家码 ${esc(s.iso || '-')}${s.override_name ? ' · 运营商名 ' + esc(s.override_name) : ''}</div>
      <label>国家码（两位字母）</label>
      <input class="iso" list="isos" maxlength="2" placeholder="如 jp" value="${esc(c.iso)}" autocapitalize="off">
      <label>运营商名称（可选）</label>
      <input class="name" placeholder="留空则不修改" value="${esc(c.name)}">
      <div class="btns">
        <button class="danger" data-act="reset">还原</button>
        <button class="primary" data-act="save">保存并应用</button>
      </div></div>`;
  }).join('');
}

async function apply() {
  const r = await exec(`${BIN} apply_conf`);
  await Promise.all([render(), showLog()]);
  return r;
}

document.getElementById('sims').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  const slot = card.dataset.slot;
  const conf = await readConf();
  if (btn.dataset.act === 'save') {
    const iso = card.querySelector('.iso').value.trim().toLowerCase();
    const name = card.querySelector('.name').value.replace(/[\r\n,]/g, ' ').trim();
    if (!/^[a-z]{2}$/.test(iso)) { toast('国家码需为两位字母'); return; }
    conf[slot] = { iso, name };
  } else {
    delete conf[slot];
  }
  btn.disabled = true;
  await writeConf(conf);
  const r = await apply();
  toast(r.code === 0 ? '已应用' : '应用失败，查看日志');
});

async function showLog() {
  const r = await exec('tail -n 40 /data/adb/nrfr/nrfr.log 2>/dev/null');
  document.getElementById('log').textContent = r.out || '(空)';
}
document.getElementById('refresh').onclick = () => { render(); showLog(); };
render(); showLog();
</script>
</body>
</html>
